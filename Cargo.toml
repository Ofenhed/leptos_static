[package]
name = "leptos_static"
version = "0.8.1"
edition = "2024"
authors = ["Marcus Ofenhed"]
license = "MIT"
description = "Render a statically hostable website using leptos"

[lib]

[dependencies]
any_spawner = "0.3"
futures = { version = "0.3", features = ["async-await"] }
hydration_context = "0.3.2"
leptos = "0.8"
leptos_integration_utils = "0.8"
leptos_meta = { version = "0.8", optional = true }
leptos_router = "0.8"
thiserror = "2.0"
tokio = { version = "1.39", features = ["fs", "io-util", "sync"], optional = true }
tracing = { version = "0.1", optional = true }
wasm-bindgen = "0.2.93"

[features]
default = ["tokio", "meta"]
i-initiated-my-own-executor = []
islands = ["leptos/islands"]
meta = ["dep:leptos_meta"]
tokio = ["dep:tokio", "any_spawner/tokio"]
tracing = ["dep:tracing"]
